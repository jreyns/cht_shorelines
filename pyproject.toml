[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cht_shorelines"
version = "0.0.1"
requires-python = ">=3.10"
authors = [
    { name = "Johan Reyns", email = "johan.reyns@deltares.nl" },
]
dependencies = [
    "numpy",
    "pandas",
    "pyproj",
    "pydantic>=2",
    "rasterio",
    "xarray",
    "matplotlib",
    "netCDF4",
    "pyyaml",
    "toml",
    "cht_utils @ git+https://github.com/deltares-research/cht_utils.git",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["cht_shorelines", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["cht_shorelines"]
